<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Analysis Tools — Threat Hunter's</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root{--bg:#080d0a;--panel:#0d1510;--panel2:#101c14;--border:#1c3022;--green:#3ddc6f;--dim:#8fa398;--muted:#607267;--red:#ff6565;--amber:#ffb545;--text:#eaf4ec}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 20% 0,#102817 0,transparent 65%),var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{padding:24px 16px;background:#090e0b;border-right:1px solid var(--border)}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 28px}.logo{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--green);border-radius:10px;color:var(--green);font-size:22px}.brand b{font:700 17px 'Space Grotesk';display:block}.brand small{color:var(--muted);font-size:9px;letter-spacing:1.3px}nav{display:grid;gap:3px}.nav{display:block;padding:10px 12px;border:1px solid transparent;border-radius:8px;color:var(--dim);text-decoration:none;font-weight:600}.nav:hover,.nav.active{background:linear-gradient(90deg,#163020,#101612);border-color:var(--border);color:var(--green)}.main{padding:28px;max-width:1250px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;color:var(--dim)}.online{font-size:12px;font-weight:700}.online:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-right:9px}.back{color:var(--green);text-decoration:none;font-weight:700}.eyebrow{font:12px 'JetBrains Mono';color:var(--green);letter-spacing:2px;text-transform:uppercase}.page-title{font:700 clamp(30px,5vw,45px) 'Space Grotesk';margin:10px 0}.sub{max-width:700px;color:var(--dim);font-size:15px;line-height:1.65;margin:0 0 26px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.panel{background:linear-gradient(140deg,#0d1711,#0a100c);border:1px solid var(--border);border-radius:16px;padding:24px}.panel h2{font:600 19px 'Space Grotesk';margin:0 0 8px}.hint{color:var(--muted);line-height:1.55;margin:0 0 20px}.label{display:block;color:var(--dim);font:11px 'JetBrains Mono';letter-spacing:.8px;text-transform:uppercase;margin:0 0 8px}.input,textarea{width:100%;color:var(--text);background:#09100b;border:1px solid var(--border);border-radius:9px;padding:13px;font:14px Inter;outline:none}.input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #3ddc6f20}textarea{min-height:158px;resize:vertical}.actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}.primary,.file-label{background:var(--green);color:#041008;border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}.secondary{background:transparent;color:var(--green);border:1px solid #297543;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.file-label input{display:none}.result{margin-top:20px;display:none}.result.show{display:block}.score{display:flex;align-items:center;gap:17px;padding:16px;border-radius:12px;background:#0a110c;border:1px solid var(--border)}.score-num{font:700 34px 'Space Grotesk';color:var(--green)}.score-num.warn{color:var(--amber)}.score-num.danger{color:var(--red)}.result h3{margin:0 0 3px;font-size:15px}.result p{margin:0;color:var(--dim);line-height:1.55}.evidence{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}.evidence li{padding:10px 12px;border-left:2px solid var(--green);background:#0b120d;color:var(--dim)}.side-title{font:600 15px 'Space Grotesk';margin:0 0 14px}.list{padding:0;margin:0;list-style:none;display:grid;gap:10px}.list li{color:var(--dim);padding-bottom:10px;border-bottom:1px solid var(--border)}.tag{font:11px 'JetBrains Mono';color:var(--green);display:block;margin-bottom:4px}.notice{margin-top:18px;padding:12px;border-radius:9px;background:#201b0c;border:1px solid #55441b;color:#d8c48b;font-size:12px;line-height:1.5}.empty{color:var(--muted);padding:18px 0}.history-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}.history-row b{display:block;word-break:break-word}.history-row span{font:11px 'JetBrains Mono';color:var(--muted)}.status-clean{color:var(--green)}.status-risk{color:var(--red)}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border)}nav{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.layout{grid-template-columns:1fr}.main{padding:22px 16px}}@media(max-width:520px){.top{margin-bottom:24px}.panel{padding:18px}.page-title{font-size:31px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">◈</div>
      <div><b>THREAT HUNTER'S</b><small>DETECT. ANALYZE. PROTECT.</small></div>
    </div>
    <nav>
      <a class="nav" href="Threat%20Hunters-dashboard.html">Dashboard</a>
      <a class="nav" href="#scan">Scan Center</a>
      <a class="nav" href="email-analysis.html">Email Analysis</a>
      <a class="nav" href="#url">URL Analysis</a>
      <a class="nav" href="#file">File Analysis</a>
      <a class="nav" href="#lookup">IP &amp; Domain Lookup</a>
      <a class="nav" href="#ioc">IOC Extractor</a>
      <a class="nav" href="#intel">Threat Intelligence</a>
      <a class="nav" href="#reports">Reports</a>
      <a class="nav" href="#history">History</a>
      <a class="nav" href="contact.html">Contact</a>
      <a class="nav" href="about.html">About</a>
    </nav>
  </aside>

  <main class="main">
    <div class="top">
      <span class="online">SYSTEM ONLINE</span>
      <a class="back" href="Threat%20Hunters-dashboard.html">← Dashboard</a>
    </div>
    <section id="content"></section>
  </main>
</div>

<script>
const pages={
 scan:{eyebrow:'Scan Center',title:'Choose a safe analysis workflow.',sub:'Start with the type of evidence you have.',form:'<div class="actions"><button class="primary" onclick="go(\'url\')">Analyze a URL</button><a href="email-analysis.html" class="secondary" style="text-decoration:none;display:inline-block;">Analyze an email (AI)</a><button class="secondary" onclick="go(\'file\')">Inspect a file</button></div>',side:'<li><span class="tag">QUICK ACCESS</span>Use dedicated tools from the navigation.</li>'},
 url:{eyebrow:'URL Analysis',title:'Inspect a link before you open it.',sub:'Local rule-based checks for phishing signals.',form:'<label class="label">URL to inspect</label><input class="input" id="target" type="url" placeholder="https://example.com/login"><div class="actions"><button class="primary" onclick="analyzeUrl()">Analyze URL</button><button class="secondary" onclick="clearResult()">Clear</button></div>',side:'<li><span class="tag">CHECKS</span>HTTPS, lookalike terms, IP hosts and subdomains.</li>'},
 file:{eyebrow:'File Analysis',title:'Inspect a file safely.',sub:'Reports basic file metadata and risky extensions.',form:'<label class="label">Select a file</label><label class="file-label">Choose file <input id="fileInput" type="file" onchange="analyzeFile(this.files[0])"></label><div class="notice">Real malware analysis requires an isolated sandbox.</div>',side:'<li><span class="tag">CHECKS</span>Extension, file name, and byte size.</li>'},
 lookup:{eyebrow:'IP & Domain Lookup',title:'Triage an IP address or domain.',sub:'Validate syntax and check suspicious keywords.',form:'<label class="label">IP address or domain</label><input class="input" id="target" placeholder="example.com or 203.0.113.10"><div class="actions"><button class="primary" onclick="lookup()">Run Lookup</button><button class="secondary" onclick="clearResult()">Clear</button></div>',side:'<li><span class="tag">CHECK</span>Format validation and risk keyword check.</li>'},
 ioc:{eyebrow:'IOC Extractor',title:'Extract indicators from text.',sub:'Find URLs, emails, IPv4 addresses, and hashes in pasted text.',form:'<label class="label">Paste logs or alert text</label><textarea id="target" placeholder="Paste text containing indicators..."></textarea><div class="actions"><button class="primary" onclick="extractIoc()">Extract IOCs</button><button class="secondary" onclick="clearResult()">Clear</button></div>',side:'<li><span class="tag">REGEX</span>Pattern-based artifact extraction.</li>'},
 intel:{eyebrow:'Threat Intelligence',title:'Threat intelligence feed status.',sub:'Review local intelligence logs.',form:'<div class="actions"><button class="primary" onclick="go(\'reports\')">Open Reports</button><button class="secondary" onclick="go(\'history\')">View Local History</button></div>',side:'<li><span class="tag">INTELLIGENCE</span>Connect feeds via backend API.</li>'},
 reports:{eyebrow:'Reports',title:'Analysis reports.',sub:'Reports generated from local scan history.',form:'<div id="historyList"></div><div class="actions"><button class="secondary" onclick="clearHistory()">Clear local reports</button></div>',side:'<li><span class="tag">STORAGE</span>Stored locally in your browser.</li>'},
 history:{eyebrow:'History',title:'Recent local scans.',sub:'Record of actions completed during this session.',form:'<div id="historyList"></div><div class="actions"><button class="secondary" onclick="clearHistory()">Clear history</button></div>',side:'<li><span class="tag">PRIVACY</span>No data leaves your device.</li>'}
};

function go(id){location.hash=id}
function current(){return location.hash.slice(1)||'scan'}
function render(){
  let id=pages[current()]?current():'scan';
  let p=pages[id];
  document.querySelectorAll('.nav').forEach(a=>{
    let href=a.getAttribute('href');
    a.classList.toggle('active', href==='#'+id || (id==='scan' && href==='#scan'));
  });
  const content = document.getElementById('content');
  if(content){
    content.innerHTML=`<div class="eyebrow">${p.eyebrow}</div><h1 class="page-title">${p.title}</h1><p class="sub">${p.sub}</p><div class="layout"><div class="panel"><h2>Workspace</h2><p class="hint">Review results carefully before making security decisions.</p>${p.form}<div class="result" id="result"></div></div><aside class="panel"><h2 class="side-title">Analyst notes</h2><ul class="list">${p.side}</ul></aside></div>`;
    if(id==='reports'||id==='history') renderHistory();
  }
}

function show(score,title,summary,items=[]){
  let result=document.getElementById('result');
  if(!result) return;
  let cls=score>=70?'danger':score>=35?'warn':'';
  result.innerHTML=`<div class="score"><div class="score-num ${cls}">${score}<small>/100</small></div><div><h3>${title}</h3><p>${summary}</p></div></div><ul class="evidence">${items.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')}</ul>`;
  result.classList.add('show');
}

function cleanText(v){return (v||'').trim()}
function save(type,value,score,title){
  let h=JSON.parse(localStorage.getItem('thHistory')||'[]');
  h.unshift({type,value:value.slice(0,100),score,title,at:new Date().toLocaleString()});
  localStorage.setItem('thHistory',JSON.stringify(h.slice(0,25)));
}
function clearResult(){
  let t=document.getElementById('target');
  let res=document.getElementById('result');
  if(t)t.value='';
  if(res)res.classList.remove('show');
}

function analyzeUrl(){
  let t=document.getElementById('target');
  let v=cleanText(t?t.value:'');
  if(!v)return show(0,'Add a URL first','Paste a complete URL, including https://.');
  let score=0,items=[];
  try{
    let u=new URL(v);
    if(u.protocol!=='https:'){score+=20;items.push('The link does not use HTTPS.');}
    if(/^\d{1,3}(\.\d{1,3}){3}$/.test(u.hostname)){score+=35;items.push('The host is an IP address rather than a domain.');}
    if(/(login|verify|secure|account|update|wallet|gift|bonus)/i.test(u.href)){score+=25;items.push('Contains terms commonly used in phishing.');}
    score=Math.min(score,100);
    let title=score>=70?'High-risk signals found':score>=35?'Review carefully':'No obvious red flags';
    show(score,title,'Local pattern check completed.',items);
    save('URL',v,score,title);
  }catch{
    show(0,'Invalid URL','Enter a valid URL like https://example.com.');
  }
}

function analyzeFile(f){
  if(!f)return;
  let risky=/\.(exe|msi|bat|cmd|js|vbs|scr|ps1|iso)$/i.test(f.name);
  let score=risky?60:0;
  let items=['File: '+f.name,'Size: '+Math.ceil(f.size/1024)+' KB'];
  if(risky)items.push('Executable file type detected. Exercise extreme caution.');
  let title=risky?'Potentially Risky Extension':'Metadata Inspected';
  show(score,title,'Browser extension inspection completed.',items);
  save('File',f.name,score,title);
}

function lookup(){
  let t=document.getElementById('target');
  let v=cleanText(t?t.value:'');
  if(!v)return show(0,'Input required','Enter a public IPv4 address or domain.');
  let isIp=/^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(v);
  show(0,'Format Validated',isIp?'Valid IPv4 format.':'Valid domain syntax.',['Live WHOIS/Reputation feeds require active backend.']);
  save('Lookup',v,0,'Format Validated');
}

function extractIoc(){
  let t=document.getElementById('target');
  let v=cleanText(t?t.value:'');
  if(!v)return show(0,'Input required','Paste logs or alert text.');
  let urls=[...new Set(v.match(/https?:\/\/[^\s'"<>]+/gi)||[])];
  let emails=[...new Set(v.match(/\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/gi)||[])];
  let items=[];
  if(urls.length) items.push(`URLs (${urls.length}): ${urls.join(', ')}`);
  if(emails.length) items.push(`Emails (${emails.length}): ${emails.join(', ')}`);
  if(!items.length) items.push('No IOC patterns matched in text.');
  show(0,'IOC Extraction Complete','Artifacts extracted.',items);
  save('IOC Extractor',v,0,'Extraction Complete');
}

function renderHistory(){
  let hl=document.getElementById('historyList');
  if(!hl) return;
  let h=JSON.parse(localStorage.getItem('thHistory')||'[]');
  hl.innerHTML=h.length?h.map(x=>`<div class="history-row"><div><b>${escapeHtml(x.type)} — ${escapeHtml(x.title)}</b><span>${escapeHtml(x.value)}</span></div><div class="${x.score>=70?'status-risk':'status-clean'}">${x.score}/100<br><span>${escapeHtml(x.at)}</span></div></div>`).join(''):'<div class="empty">No local scans yet.</div>';
}

function clearHistory(){
  localStorage.removeItem('thHistory');
  renderHistory();
}

function escapeHtml(s){
  return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
render();
</script>
</body>
</html>
